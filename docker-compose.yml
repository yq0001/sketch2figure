services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      DATABASE_URL: sqlite:////app/data/sketch2figure.db
      DATA_DIR: /app/data
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - sketch2figure_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  sketch2figure_data:
